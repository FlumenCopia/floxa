<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | FLOXA SuperAdmin Platform</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #020806;
      color: #e8f5ef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(6, 22, 15, 0.88);
      border: 1px solid rgba(77, 255, 160, 0.25);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 440px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(20px);
    }
    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border-radius: 12px;
      background: rgba(77, 255, 160, 0.12);
      border: 1px solid rgba(77, 255, 160, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4dffa0;
      font-size: 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f3f8f4;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 13px;
      color: #89aca0;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background: #4dffa0;
      color: #001f11;
      border: none;
      padding: 11px 26px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <h1>SuperAdmin Console Offline</h1>
    <p>FLOXA SuperAdmin requires an active network connection to monitor platform clusters, agency accounts, and commercial telemetry.</p>
    <button onclick="window.location.reload()">Check Connection & Retry</button>
  </div>
</body>
</html>
